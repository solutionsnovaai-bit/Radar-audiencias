<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar de Audiências · Diferencial Soluções</title>
  <meta name="description" content="Painel de audiências do escritório: zona de alerta, agenda e avisos automáticos por WhatsApp e e-mail.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6B3A1F">
  <meta property="og:title" content="Radar de Audiências · Diferencial Soluções">
  <meta property="og:description" content="Nenhuma audiência passa despercebida.">
  <meta property="og:image" content="/assets/og.png">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icone-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/assets/fontes/manrope-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fontes/marcellus-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="modulepreload" href="/assets/loader3d.js">
  <script>
    (function () {
      try { var t = localStorage.getItem('radar-tema'); if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light'; } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Abertura -->
  <section id="abertura" class="abertura" aria-label="Carregando o Radar de Audiências">
    <canvas id="cena3d" class="abertura-cena" aria-hidden="true"></canvas>
    <div class="abertura-reserva" aria-hidden="true">
      <div class="reserva-radar"><i></i><i></i><i></i><span class="reserva-varredura"></span></div>
      <svg class="reserva-mono" viewBox="0 0 228 228"><path class="m-quadro" d="M30 3.5H198A26.5 26.5 0 0 1 224.5 30V198A26.5 26.5 0 0 1 198 224.5H30A26.5 26.5 0 0 1 3.5 198V30A26.5 26.5 0 0 1 30 3.5Z"/><path class="m-letra" d="M76 63.5H120A49.5 49.5 0 0 1 120 162.5H76Z"/></svg>
    </div>
    <div class="abertura-texto">
      <span class="wordmark wordmark-abertura" role="img" aria-label="Diferencial Soluções"></span>
      <p class="abertura-titulo"><span>Radar</span> <span>de</span> <span>Audiências</span></p>
      <div class="abertura-barra" aria-hidden="true"><span id="abertura-barra"></span></div>
      <p class="abertura-status" id="abertura-status" aria-live="polite">Ligando o radar…</p>
    </div>
  </section>

  <!-- Acesso -->
  <section id="acesso" class="acesso" hidden aria-labelledby="acesso-titulo">
    <form id="form-acesso" class="acesso-cartao" autocomplete="off">
      <span class="wordmark wordmark-acesso" role="img" aria-label="Diferencial Soluções"></span>
      <h1 id="acesso-titulo">Radar de Audiências</h1>
      <p>Digite o PIN do escritório para abrir o painel.</p>
      <label class="pin" for="campo-pin">
        <span class="sr">PIN</span>
        <input id="campo-pin" name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="••••••" required>
      </label>
      <label class="lembrar"><input type="checkbox" id="lembrar-pin"> Manter conectado neste aparelho</label>
      <button class="botao botao-primario botao-largo" type="submit"><span>Entrar</span></button>
      <p class="acesso-erro" id="acesso-erro" role="alert"></p>
    </form>
  </section>

  <!-- Painel -->
  <div id="app" class="app" hidden>
    <header class="topo">
      <div class="topo-marca">
        <span class="wordmark wordmark-topo" role="img" aria-label="Diferencial Soluções"></span>
        <span class="topo-divisor" aria-hidden="true"></span>
        <div class="topo-titulo">
          <strong>Radar de Audiências</strong>
          <span id="topo-relogio" class="topo-relogio"></span>
        </div>
      </div>
      <div class="topo-acoes">
        <button id="status-motor" class="status-motor" type="button" title="Situação do motor"><i></i><span>Conectando…</span></button>
        <button id="bt-tema" class="botao-icone" type="button" aria-label="Alternar tema claro/escuro"></button>
        <button id="bt-verificar" class="botao botao-contorno" type="button"></button>
        <button id="bt-nova" class="botao botao-primario" type="button"></button>
      </div>
    </header>

    <div id="faixa-demo" class="faixa-demo" hidden></div>

    <nav class="abas" aria-label="Seções do painel">
      <button type="button" data-aba="geral" aria-current="page">Visão geral</button>
      <button type="button" data-aba="agenda">Agenda</button>
      <button type="button" data-aba="historico">Histórico de avisos</button>
      <span class="abas-indicador" aria-hidden="true"></span>
    </nav>

    <main id="conteudo" class="conteudo" tabindex="-1"></main>

    <footer class="rodape">
      <span>Radar de Audiências · Diferencial Soluções</span>
      <span id="rodape-info"></span>
    </footer>
  </div>

  <!-- Detalhes -->
  <div id="gaveta-fundo" class="gaveta-fundo" hidden></div>
  <aside id="gaveta" class="gaveta" hidden aria-modal="true" role="dialog" aria-labelledby="gaveta-titulo"></aside>

  <!-- Nova / editar audiência -->
  <dialog id="modal" class="modal" aria-labelledby="modal-titulo"></dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
